<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Bébé Atelier · 링크</title>
<meta name="description" content="아기를 더 잘 이해하고 싶은 엄마 아빠를 위한 Bébé Atelier의 상품·링크 모음">
<meta property="og:title" content="Bébé Atelier"><meta property="og:image" content="assets/logo.png">
<link rel="icon" href="assets/button.png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&family=Noto+Serif+KR:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{--bg:#f5efe3;--card:#fffaf2;--ink:#3e2f22;--muted:#86705a;--line:#e4d8c6;--accent:#84623f;--chip:#efe4d2}
@media (prefers-color-scheme:dark){:root{--bg:#1d1813;--card:#27201a;--ink:#f1e7d8;--muted:#b9a68f;--line:#3a3027;--accent:#d9b88f;--chip:#33291f}}
*{box-sizing:border-box}html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Noto Serif KR",serif;line-height:1.55}
.wrap{max-width:560px;margin:0 auto;padding:28px 16px 56px}
header{text-align:center}
header img{width:76px;height:76px;border-radius:50%;filter:drop-shadow(0 3px 6px rgba(60,40,20,.18))}
h1{font-family:"Cormorant Garamond",serif;font-weight:500;font-size:40px;margin:10px 0 0;letter-spacing:.5px}
.tag{color:var(--muted);font-size:15px;margin:4px 0 14px}
.social{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
.social a{font-size:13px;color:var(--ink);text-decoration:none;border:1px solid var(--line);border-radius:999px;padding:6px 14px;background:var(--card)}
.notice{margin:20px 0 14px;font-size:13px;color:var(--muted);background:var(--chip);border-radius:12px;padding:10px 14px;text-align:center}
.find{display:flex;gap:8px;margin:0 0 16px}
.find input{flex:1;min-width:0;font:inherit;font-size:16px;padding:12px 14px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--ink)}
.find button{font:inherit;font-size:15px;padding:0 18px;border-radius:12px;border:0;background:var(--accent);color:var(--bg);cursor:pointer}
.stitch{border:0;border-top:2px dashed var(--line);margin:22px 0}
ol{list-style:none;margin:0;padding:0;display:grid;gap:10px}
li a{display:flex;align-items:center;gap:14px;text-decoration:none;color:inherit;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px 14px;transition:transform .15s}
li a:active{transform:scale(.99)}
li.hit a{outline:2px solid var(--accent)}
.no{flex:0 0 auto;width:46px;height:46px;border-radius:50%;display:grid;place-items:center;background:var(--chip);font-family:"Noto Serif KR",serif;font-variant-numeric:lining-nums tabular-nums;font-size:19px;font-weight:500;color:var(--accent)}
.thumb{flex:0 0 auto;width:56px;height:56px;border-radius:10px;object-fit:cover}
.txt{min-width:0}.name{font-size:16px;font-weight:500;overflow-wrap:anywhere}.meta{font-size:12px;color:var(--muted)}
.go{margin-left:auto;color:var(--muted);font-size:20px}
.msg{margin:-6px 0 10px;font-size:13px;color:var(--muted);text-align:center}.reset{font:inherit;font-size:13px;border:0;background:none;color:var(--accent);text-decoration:underline;cursor:pointer}
.empty{text-align:center;color:var(--muted);padding:28px 0}
footer{margin-top:28px;font-size:12px;color:var(--muted);text-align:center}
</style></head>
<body><div class="wrap">
<header><img src="assets/button.png" alt="Bébé Atelier 로고"><h1>Bébé Atelier</h1>
<p class="tag">우리 아기를 더 깊이 알아 가는 시간</p>
<nav class="social"><a href="https://www.youtube.com/@bebeatelier" target="_blank" rel="noopener">YouTube</a>
<a href="https://www.instagram.com/bebeatelier.official/" target="_blank" rel="noopener">Instagram</a></nav></header>
<p class="notice">이 페이지의 상품 링크는 쿠팡 파트너스 활동의 일환으로, 이에 따른 일정액의 수수료를 제공받습니다.</p>
<form class="find" id="f"><input id="q" type="search" autocomplete="off" placeholder="번호, 영상 주소, 상품 이름" aria-label="번호·영상 주소·상품 이름으로 찾기"><button>찾기</button></form>
<p class="msg" id="m" hidden></p>
<hr class="stitch">
<ol>
<p class="empty">곧 첫 상품이 올라와요.</p>
</ol>
<footer>가격과 재고는 쿠팡에서 바뀔 수 있어요. 구매 전 상품 페이지의 사용 연령·인증 정보를 꼭 확인해 주세요.</footer>
</div><script>
const L=[...document.querySelectorAll('ol li')],M=document.getElementById('m'),Q=document.getElementById('q');
function vkey(u){let m=u.match(/(?:youtube\.com\/(?:shorts\/|watch\?(?:.*&)?v=|embed\/|live\/)|youtu\.be\/)([A-Za-z0-9_-]{11})/);if(m)return 'yt:'+m[1];
m=u.match(/instagram\.com\/(?:[^\/]+\/)?(?:reels?|p|tv)\/([A-Za-z0-9_-]+)/);if(m)return 'ig:'+m[1];return '';}
function show(list,msg){L.forEach(e=>{e.hidden=list&&!list.includes(e);e.classList.toggle('hit',!!list&&list.length===1&&list.includes(e));});
if(msg){M.innerHTML=msg+(list?' <button class="reset" type="button" onclick="clearQ()">전체 보기</button>':'');M.hidden=false;}else M.hidden=true;
if(list&&list[0])list[0].scrollIntoView({behavior:'smooth',block:'center'});}
function clearQ(){Q.value='';show(null,'');history.replaceState(null,'',location.pathname);}
function find(raw){const s=String(raw||'').trim();if(!s){show(null,'');return;}
const k=vkey(s);if(k){const r=L.filter(e=>e.dataset.v.split(' ').includes(k));
return show(r.length?r:[],r.length?'이 영상에 나온 상품이에요':'이 영상의 상품을 아직 찾지 못했어요. 영상에서 본 번호로 찾아 주세요.');}
if(/^#?\s*\d+\s*번?$/.test(s)){const n=s.replace(/\D/g,'');const r=L.filter(e=>e.dataset.no===n);
return show(r,r.length?n+'번 상품이에요':n+'번 상품은 아직 없어요');}
const w=s.toLowerCase().split(/\s+/);const r=L.filter(e=>w.every(x=>e.dataset.w.includes(x)));
show(r,r.length?r.length+'개 찾았어요':'찾는 상품이 없어요');}
document.getElementById('f').addEventListener('submit',e=>{e.preventDefault();find(Q.value);Q.blur();});
Q.addEventListener('input',()=>{if(!Q.value.trim())show(null,'');});
const h=decodeURIComponent(location.hash.slice(1));const qp=new URLSearchParams(location.search).get('q')||new URLSearchParams(location.search).get('v');
if(qp){Q.value=qp;find(qp);}else if(h){find(h);}
</script></body></html>
